<!doctype html>
<html dir="ltr">
  <head>
    <script>
      // When served from a HyperBEAM node via the Arweave path-manifest device
      // the app lives under /<ManifestID>/... — anchor all relative URLs to the
      // manifest root so assets resolve on deep links too.
      // Keep the regex in sync with ui/util/manifest-prefix.ts.
      (function () {
        var match = window.location.pathname.match(/^\/([A-Za-z0-9_-]{43})(?=\/|$)/);
        if (match) {
          var base = document.createElement('base');
          base.href = match[0] + '/';
          document.head.appendChild(base);
          // The app hash-routes under a manifest (only single-segment paths
          // fall back to index.html), so fold any path remainder into the hash.
          var rest = window.location.pathname.slice(match[0].length);
          if (rest && rest !== '/' && !window.location.hash) {
            window.history.replaceState(null, '', match[0] + '#' + rest + window.location.search);
          }
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Expires" content="0" />

    <link rel="preload" href="/font/v1/300.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/font/v1/300i.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/font/v1/400.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/font/v1/400i.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/font/v1/700.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/font/v1/700i.woff" as="font" type="font/woff" crossorigin />

    <link rel="shortcut icon" href="/img/favicon_128.png" />

    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url('/font/v1/300.woff') format('woff');
      }
      @font-face {
        font-family: 'Inter';
        font-style: italic;
        font-weight: 300;
        font-display: swap;
        src: url('/font/v1/300i.woff') format('woff');
      }
      @font-face {

        font-weight: 400;
        font-display: swap;
        src: url('/font/v1/400.woff') format('woff');
      }
      @font-face {
        font-family: 'Inter';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/font/v1/400i.woff') format('woff');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/font/v1/700.woff') format('woff');
      }
      @font-face {
        font-family: 'Inter';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('/font/v1/700i.woff') format('woff');
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/ui/index.tsx"></script>
  </body>
</html>
